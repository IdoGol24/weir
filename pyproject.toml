[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "pyright>=1.1",
    "pytest>=8",
    "hypothesis>=6",
    "hatchling>=1.26",
    "import-linter>=2",
    "opentelemetry-proto>=1.44",
    "opentelemetry-sdk>=1.44",
    "opentelemetry-exporter-otlp-proto-common>=1.44",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["packages/weir/src", "packages/weir-tracegen/src", "packages/weir-run/src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

# Determinism guardrail (G1, constitution #1): nothing in this codebase - engine
# or tracegen - may read the wall clock. The only sanctioned randomness is
# render-time commitment salts (`secrets`, spec §8), which is out of scope for
# this demo slice (no §8 commitments here - see the plan). `random` is banned
# repo-wide too; tracegen's seeded core is exempted below because it *is* the
# one place a seeded `random.Random(seed)` is the deterministic PRNG (L6).
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"datetime.datetime.now" = { msg = "Determinism (G1): no wall-clock reads anywhere. Timestamps come from the trace or tracegen's seeded clock." }
"time.time" = { msg = "Determinism (G1): no wall-clock reads anywhere." }
"time.time_ns" = { msg = "Determinism (G1): no wall-clock reads anywhere." }
"random" = { msg = "Determinism (G1): no unseeded randomness. tracegen's seeded core (L6) is the one exempted module." }

[tool.ruff.lint.per-file-ignores]
# The one place a seeded `random.Random(seed)` is legitimate (L6 deterministic core).
"packages/weir-tracegen/src/weir_tracegen/_rng.py" = ["TID251"]
# Frozen generation provenance (byte-copy, never regenerate): imports are
# deliberately after LangchainInstrumentor().instrument() so the instrumentor
# patches langchain_core before it loads - real third-party script shape.
"fixtures/foreign/langchain-collector/toy_agent.py" = ["E402"]

[tool.pyright]
# Point pyright at the project venv. Without this it resolves against
# whatever python is on PATH and reports every third-party import as
# unresolved, which made the local type gate ~1200 lines of noise. CI
# happened to work because `uv run` puts the venv on PATH first.
venvPath = "."
venv = ".venv"
include = [
    "packages/weir/src",
    "packages/weir-tracegen/src",
    "packages/weir-run/src",
    "packages/weir-run/tests",
    "packages/weir-run/demo",
    "tests",
]
typeCheckingMode = "strict"
pythonVersion = "3.12"

[tool.pytest.ini_options]
testpaths = [
    "tests",
    "packages/weir/tests",
    "packages/weir-tracegen/tests",
    "packages/weir-run/tests",
]
pythonpath = ["tests"]

[tool.importlinter]
root_packages = ["weir", "weir_tracegen", "weir_run"]
include_external_packages = true

[[tool.importlinter.contracts]]
# weir.exposure is a source here, not an exception: the wire walk lives in
# weir.adapters.otel.exposure and the two halves meet at weir.schema.exposure,
# so NOTHING under weir.exposure needs the adapter - __init__ included. That
# is what makes this rule exception-free, and an exception-free rule is the
# only kind that catches a convenience import added six months from now.
name = "Analysis-path purity: no I/O or CLI in the pure core"
type = "forbidden"
source_modules = [
    "weir.graph",
    "weir.gauge",
    "weir.label",
    "weir.taint",
    "weir.evaluate",
    "weir.exposure",
]
forbidden_modules = ["weir.cli", "weir.adapters", "weir.inventory"]

[[tool.importlinter.contracts]]
# The inventory reads files and holds credential values in memory, so it is a
# leaf beside the trace pipeline: it reuses the catalog's detectors and
# nothing else, and no rendering or CLI code can reach into it backwards.
name = "inventory reaches only the catalog"
type = "forbidden"
source_modules = ["weir.inventory"]
forbidden_modules = [
    "weir.audit",
    "weir.cli",
    "weir.adapters",
    "weir.graph",
    "weir.gauge",
    "weir.label",
    "weir.taint",
    "weir.evaluate",
    "weir.exposure",
    "weir.report",
    "weir.rules_commons",
]

[[tool.importlinter.contracts]]
# docs/canary.md: the judge is a pure function of its input bytes. It reads
# the files it is given and nothing else: no socket, no process, no clock, no
# randomness, and none of the trace pipeline. The canary runner owns the
# loopback mock and the flows; it is a separate package that weir never
# imports (the "weir-run is outside weir-scan" contract below).
name = "canary judge is pure: no network, process, clock or pipeline"
type = "forbidden"
source_modules = ["weir.canary"]
forbidden_modules = [
    "weir.audit",
    "socket",
    "ssl",
    "http",
    "urllib",
    "ftplib",
    "smtplib",
    "xmlrpc",
    "socketserver",
    "asyncio",
    "selectors",
    "subprocess",
    "multiprocessing",
    "concurrent",
    "time",
    "datetime",
    "random",
    "secrets",
    "weir.cli",
    "weir.adapters",
    "weir.inventory",
    "weir.graph",
    "weir.gauge",
    "weir.label",
    "weir.taint",
    "weir.evaluate",
    "weir.exposure",
    "weir.report",
    "weir.rules_commons",
    "weir.catalog",
    "weir_tracegen",
]

[[tool.importlinter.contracts]]
# docs/audit.md: the audit is a pure function of its input bytes, their
# paths and `CLAUDE_CONFIG_DIR`. It reads the files it is given and nothing
# else: no socket, no process, no clock, no
# randomness (`secrets` included: it never makes a key), and none of the
# trace pipeline. It reuses the canary judge's OTLP walk, file collection and
# printing rule, and the inventory's record types and name rule.
name = "audit is pure: no network, process, clock, randomness or pipeline"
type = "forbidden"
source_modules = ["weir.audit"]
forbidden_modules = [
    "socket",
    "ssl",
    "http",
    "urllib",
    "ftplib",
    "smtplib",
    "xmlrpc",
    "socketserver",
    "asyncio",
    "selectors",
    "subprocess",
    "multiprocessing",
    "concurrent",
    "time",
    "datetime",
    "random",
    "secrets",
    "weir.cli",
    "weir.adapters",
    "weir.inventory.core",
    "weir.inventory.fingerprint",
    "weir.graph",
    "weir.gauge",
    "weir.label",
    "weir.taint",
    "weir.evaluate",
    "weir.exposure",
    "weir.report",
    "weir.rules_commons",
    "weir_tracegen",
]

[[tool.importlinter.contracts]]
name = "tracegen is dev-side only: the engine never imports it"
type = "forbidden"
source_modules = ["weir"]
forbidden_modules = ["weir_tracegen"]

[[tool.importlinter.contracts]]
# The canary runner opens a loopback socket for its mock, so it lives outside
# weir-scan, and weir never imports it: the judge stays a pure function of
# its input bytes (docs/canary.md, "The boundary").
name = "weir-run is outside weir-scan: weir never imports weir_run"
type = "forbidden"
source_modules = ["weir", "weir_tracegen"]
forbidden_modules = ["weir_run"]

[[tool.importlinter.contracts]]
# The runner calls the judge only through its documented command line.
name = "weir_run reaches weir only through the judge's command line"
type = "forbidden"
source_modules = ["weir_run"]
forbidden_modules = ["weir", "weir_tracegen"]

[[tool.importlinter.contracts]]
name = "tracegen reaches only the schema seam"
type = "forbidden"
source_modules = ["weir_tracegen"]
forbidden_modules = [
    "weir.catalog",
    "weir.graph",
    "weir.gauge",
    "weir.label",
    "weir.taint",
    "weir.evaluate",
    "weir.exposure",
    "weir.report",
    "weir.rules_commons",
    "weir.cli",
]

[[tool.importlinter.contracts]]
name = "adapters reach only the schema seam"
type = "forbidden"
source_modules = ["weir.adapters"]
forbidden_modules = [
    "weir.catalog",
    "weir.graph",
    "weir.gauge",
    "weir.label",
    "weir.taint",
    "weir.evaluate",
    "weir.exposure",
    "weir.report",
    "weir.rules_commons",
    "weir.cli",
]
