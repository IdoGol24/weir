[project]
name = "weir-run"
version = "0.1.0"
description = "Canary runner for weir canary judge: plants fake canaries, runs a program's flows against a loopback mock, judges the captured telemetry"
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # The judge. The runner calls it only through its command line
    # (`weir canary judge`, docs/canary.md), never by import.
    "weir-scan",
    "click>=8.1",
    "opentelemetry-proto>=1.44",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.12",
    "Framework :: Pytest",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Testing",
    "Topic :: Security",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/IdoGol24/weir"
Repository = "https://github.com/IdoGol24/weir"
Issues = "https://github.com/IdoGol24/weir/issues"
Changelog = "https://github.com/IdoGol24/weir/blob/main/CHANGELOG.md"
Security = "https://github.com/IdoGol24/weir/blob/main/SECURITY.md"

[tool.uv.sources]
weir-scan = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/weir_run"]

[project.scripts]
weir-run = "weir_run.cli:main"

[project.entry-points.pytest11]
weir_run = "weir_run.pytest_plugin"
