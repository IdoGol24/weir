[project]
name = "weir"
version = "0.1.0"
description = "weir — deterministic, post-hoc verification engine for AI-agent sessions"
requires-python = ">=3.12"
dependencies = [
    "msgspec>=0.18",
    "click>=8.1",
    "jinja2>=3.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/weir"]

[project.scripts]
weir = "weir.cli.main:main"
