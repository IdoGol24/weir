[project]
name = "weir-scan"
version = "0.1.0"
description = "weir - deterministic, post-hoc verification engine for AI-agent sessions"
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "msgspec>=0.18",
    "click>=8.1",
    "jinja2>=3.1",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.12",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Security",
    "Typing :: Typed",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/weir"]

[project.scripts]
weir = "weir.cli.main:main"

[project.urls]
Homepage = "https://github.com/IdoGol24/weir"
Repository = "https://github.com/IdoGol24/weir"
Issues = "https://github.com/IdoGol24/weir/issues"
Changelog = "https://github.com/IdoGol24/weir/blob/main/weir/CHANGELOG.md"
Security = "https://github.com/IdoGol24/weir/blob/main/weir/SECURITY.md"
