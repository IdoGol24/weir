[project]
name = "weir-tracegen"
version = "0.1.0"
description = "weir-tracegen - dev-side deterministic synthetic trace generator (never runtime code)"
requires-python = ">=3.12"
dependencies = [
    "weir",
    "click>=8.1",
]

[tool.uv.sources]
weir = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/weir_tracegen"]

[project.scripts]
weir-tracegen = "weir_tracegen.cli:main"
