name: release

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Sync environment
        run: uv sync
      - name: Full test gate before anything is published
        run: uv run pytest -q
      - name: Import contracts
        run: uv run lint-imports
      # Each package builds into its own directory so each publish step
      # uploads exactly one project's files.
      - name: Build weir-scan
        run: uv build packages/weir --out-dir dist/weir-scan
      - name: Build weir-run
        run: uv build packages/weir-run --out-dir dist/weir-run
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # Trusted publishing (OIDC), one job and one environment per project.
  # PyPI matches an OIDC token to a single trusted publisher by repository,
  # workflow and environment, so two projects sharing one environment get a
  # token scoped to only one of them. Each environment must exist in the
  # repository settings:
  #   - weir-scan: trusted publisher (this repository, workflow release.yml,
  #     environment pypi)
  #   - weir-run: trusted publisher (this repository, workflow release.yml,
  #     environment pypi-weir-run)
  # No API token or secret is stored anywhere. skip-existing lets a
  # re-release succeed when some files are already on PyPI.
  publish-weir-scan:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish weir-scan
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/weir-scan/
          skip-existing: true

  publish-weir-run:
    # weir-run requires weir-scan>=0.6.0, so it must not appear on PyPI
    # before the weir-scan version it depends on. A failed weir-scan job
    # stops this one before it uploads.
    needs: [build, publish-weir-scan]
    runs-on: ubuntu-latest
    environment: pypi-weir-run
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish weir-run
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/weir-run/
          skip-existing: true
