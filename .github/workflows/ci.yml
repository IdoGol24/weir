name: CI

on:
  push:
    branches: [main, 'release/**']
  pull_request:
    branches: [main, 'release/**']

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Sync dependencies
        run: uv sync

      # weir-run isolates flows in an unprivileged user and network
      # namespace. Ubuntu restricts those by default; allow them, and make
      # the isolation tests fail rather than skip if isolation is missing.
      - name: Allow unprivileged user namespaces
        if: runner.os == 'Linux'
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          echo "WEIR_TEST_REQUIRE_NETNS=1" >> "$GITHUB_ENV"

      - name: Run tests
        run: uv run pytest -q

      - name: Check import contracts
        run: uv run lint-imports

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run pyright
